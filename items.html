<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Ajouter des Items</title>

        body { font-family: Arial; margin: 40px; }
        input[type="text"] { padding: 5px; width: 300px; }
        button { padding: 5px 15px; background-color: #3498db; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Ma Liste d'Items</h1>

        <p>
        <input type="submit" value="Ajouter l'item">
    </form>

</html>
