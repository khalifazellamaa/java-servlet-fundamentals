<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form to JSP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input[type="text"], input[type="date"] { padding: 5px; width: 200px; }
        button { padding: 8px 20px; background-color: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <h1>Formulaire vers JSP (JavaBean)</h1>
    
    <form method="POST" action="bean.jsp">
        
        <div class="form-group">
            <label for="firstName">First Name :</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>
        
        <div class="form-group">
            <label for="lastName">Last Name :</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>
        
        <div class="form-group">
            <label for="birthDate">Birth Date :</label>
            <input type="date" id="birthDate" name="birthDate" required>
        </div>
        
        <div class="form-group">
            <label>Sex :</label>
            <input type="radio" id="male" name="sex" value="Male" checked>
            <label for="male" style="width:auto; font-weight:normal;">Male</label>
            
            <input type="radio" id="female" name="sex" value="Female">
            <label for="female" style="width:auto; font-weight:normal;">Female</label>
        </div>
        
        <button type="submit">Envoyer vers bean.jsp</button>
    </form>
</body>
</html>
